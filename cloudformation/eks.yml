AWSTemplateFormatVersion: "2010-09-09"
Description: EKS control plane for the interview lab - no worker nodes

Metadata:
  com.aws.cloudformation.Context:
    arch: "Creates an EKS control plane in two existing subnets and a service role assumed by EKS; no worker nodes are provisioned."

Parameters:
  SubnetA:
    Type: AWS::EC2::Subnet::Id

  SubnetB:
    Type: AWS::EC2::Subnet::Id

Resources:
  EksClusterRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "Grants the EKS service permissions to manage supporting AWS resources for the cluster."
    Properties:
      RoleName: interview-eks-cluster-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EksCluster:
    Type: AWS::EKS::Cluster
    Metadata:
      com.aws.cloudformation.Context:
        why: "Provides a managed Kubernetes control plane for the interview lab without provisioning worker nodes."
    Properties:
      Name: interview-eks
      RoleArn: !GetAtt EksClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      Tags:
        - Key: Project
          Value: cloudformation-interview-lab

Outputs:
  ClusterName:
    Value: !Ref EksCluster

  ClusterEndpoint:
    Value: !GetAtt EksCluster.Endpoint

  ClusterRoleArn:
    Value: !GetAtt EksClusterRole.Arn