apiVersion: v1
kind: Namespace
metadata:
  name: orders-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  namespace: orders-lab
data:
  SPRING_PROFILES_ACTIVE: "qa"
  LOGGING_LEVEL_ROOT: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: orders-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: 905418207697.dkr.ecr.us-east-1.amazonaws.com/orders-service:0bd6c340a2f5a500c2d10cf5fdadde5b8a501122-39330188083-1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: orders-config
          env:
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=50.0"
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-demo-secret
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: orders-lab
spec:
  selector:
    app: orders-service
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP