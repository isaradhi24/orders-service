name: CloudFormation Interview Lab

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::149703445367:role/interview-github-deploy-role
          aws-region: us-east-1
          allowed-account-ids: "149703445367"
          role-session-name: cloudformation-lab-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate bootstrap template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/bootstrap-oidc.yml
      - name: Deploy networking stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network.yml \
            --stack-name interview-network \
            --role-arn arn:aws:iam::149703445367:role/interview-cfn-execution-role \
            --no-fail-on-empty-changeset
      - name: Show networking outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name interview-network \
            --query 'Stacks[0].Outputs' \
            --output table  
      
      - name: Deploy EC2 stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/ec2.yml

          aws cloudformation deploy \
            --template-file cloudformation/ec2.yml \
            --stack-name interview-ec2 \
            --role-arn arn:aws:iam::149703445367:role/interview-cfn-execution-role \
            --parameter-overrides \
              VpcId=vpc-05e6cdb2e34e1f270 \
              SubnetId=subnet-0d5c62b6553c6351e \
            --no-fail-on-empty-changeset

      - name: Show EC2 outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name interview-ec2 \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Deploy EKS stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/eks.yml

          aws cloudformation deploy \
            --template-file cloudformation/eks.yml \
            --stack-name interview-eks \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn arn:aws:iam::149703445367:role/interview-cfn-execution-role \
            --parameter-overrides \
              SubnetA=subnet-0d5c62b6553c6351e \
              SubnetB=subnet-008fa2bc6c0f58ee2 \
            --no-fail-on-empty-changeset

      - name: Show EKS outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name interview-eks \
            --query 'Stacks[0].Outputs' \
            --output table